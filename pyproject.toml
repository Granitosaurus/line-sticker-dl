[project]
name = "line-sticker-dl"
version = "1.2.0"
description = "line sticker downloader"
readme = "README.md"
authors = [{ name = "granitosaurus", email = "tinarg@protonmail.com" }]
keywords = ["scraper", "web-crawling", "cli", "sticker"]
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "parsel>=1.9",
    "questionary>=2.0",
    "aiohttp>=3.9",
]

[project.urls]
Homepage = "https://github.com/granitosaurus/line-sticker-dl"
Repository = "https://github.com/granitosaurus/line-sticker-dl"

[project.scripts]
line-sticker-dl = "linestickerdl.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["linestickerdl", "tests", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["linestickerdl"]

[dependency-groups]
dev = [
    "pytest>=8",
]
